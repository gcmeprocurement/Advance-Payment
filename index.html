<title>Freight Forwarder Advance Payment</title>

<style>

.wrap{max-width:1560px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.card-h{min-height:52px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;font-size:16px;font-weight:700}

.band{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--band);color:var(--pri);font-size:14px;font-weight:700}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}

.sec{padding:20px 22px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}

.sec-h .n{width:26px;height:26px;border-radius:13px;background:var(--pri);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}

.fld.span2{grid-column:span 2}.fld.span3{grid-column:1/-1}
.req{color:var(--danger)}
.val{min-height:36px;padding:8px 0;font-size:14px;border-bottom:1px dashed var(--line);white-space:pre-wrap;word-break:break-word}
.r{text-align:right!important;font-variant-numeric:tabular-nums}
.items td{padding:6px 8px}.items th{padding:10px 8px}
.items .t{height:34px}
.items tfoot td{background:#F7F8FD;font-weight:700;border-top:2px solid var(--pri);padding:10px 8px}
.iconbtn{width:32px;height:32px;border:1px solid var(--inp);border-radius:6px;background:#fff;cursor:pointer;color:var(--danger);font-size:16px;line-height:1}
.iconbtn:disabled{opacity:.35;cursor:not-allowed}
.addrow{margin-top:12px}
.route{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:14px}
.lv{padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700;border:1px solid #D0D5DD;color:#98A2B3;background:#fff}
.lv.on{border-color:var(--pri-line);background:var(--pri-soft);color:var(--pri)}
.flow{display:flex;padding:20px 12px 16px;overflow-x:auto}
.step{flex:1;min-width:120px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding:0 4px}
.step:not(:last-child)::after{content:'';position:absolute;top:20px;left:calc(50% + 24px);right:calc(-50% + 24px);height:2px;background:#CBD2DC}
.step.done:not(:last-child)::after{background:var(--pri)}
.node{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:2px solid #B8C1CE;color:#5B6678;position:relative;z-index:1}
.step.ap .node{background:var(--ap)}.step.ac .node{background:var(--ac)}
.step.done .node{border-color:var(--pri);color:var(--pri)}
.step.cur .node{border-color:var(--pri);box-shadow:0 0 0 5px var(--pri-line);color:var(--pri)}
.step.bad .node{border-color:var(--danger);box-shadow:0 0 0 5px #F8D3D0;color:var(--danger)}
.step.na{opacity:.4}
.step b{font-size:12.5px;margin-top:10px;line-height:1.3}
.step small{font-size:11px;color:var(--muted2);margin-top:2px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);padding:0 20px 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid #B8C1CE;vertical-align:-3px;margin-right:6px}
.notice{margin-top:18px;padding:12px 16px;border-radius:8px;font-size:13px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.notice.info{background:var(--pri-soft);border-color:var(--pri-line);color:var(--pri)}
.notice.warn{background:#FFF7EB;border-color:#F5C98A;color:#8A4B00}
.notice.bad{background:#FDECEC;border-color:#F3B5B5;color:var(--danger)}
.notice.good{background:#E6F6EA;border-color:#B7E3C1;color:#146C2E}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}.kv b{font-variant-numeric:tabular-nums;text-align:right}
.side .body{padding:6px 18px 14px}
.hist{list-style:none;margin:0;padding:8px 18px 16px;max-height:520px;overflow:auto}
.hist li{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--line);margin-left:6px}
.hist li:last-child{border-left-color:transparent}
.hist li::before{content:'';position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:6px;background:#fff;border:2px solid var(--pri)}
.hist .a{font-size:13px;font-weight:600}
.hist .m{font-size:12px;color:var(--muted2);margin-top:2px}
.hist .c{font-size:12.5px;margin-top:4px;background:#F7F8FD;border-radius:6px;padding:6px 8px;color:var(--muted)}
.diff{margin-top:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.diff{grid-template-columns:minmax(0,1fr)}}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
.overlay{position:fixed;inset:0;background:rgba(27,36,51,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.dlg{width:760px;max-width:100%;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(27,36,51,.35);display:flex;flex-direction:column}
.dlg.small{width:520px}
.dlg-h{padding:22px 28px;border-bottom:1px solid #D7DDE6}
.dlg-h h2{margin:0;font-size:22px;color:var(--pri)}
.dlg-b{padding:24px 28px;display:flex;flex-direction:column;gap:16px}
.dlg-f{padding:16px 28px;border-top:1px solid #D7DDE6;display:flex;justify-content:flex-end;gap:12px}
.opt{display:flex;gap:12px;align-items:flex-start;cursor:pointer;border-radius:10px;padding:14px 16px;border:1px solid #B8C1CE;background:#fff}
.opt.on{padding:13px 15px;border:2px solid var(--pri);background:var(--pri-soft)}
.opt input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--pri);flex:none}
.opt b{display:block;font-size:15px;font-weight:600}
.opt span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mini i{font-style:normal;font-size:11.5px;padding:3px 9px;border-radius:10px;border:1px solid #B8C1CE}
.mini i.ap{background:var(--ap)}.mini i.ac{background:var(--ac)}
#toast{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));left:calc(16px + env(safe-area-inset-left,0px));align-items:flex-end;pointer-events:none;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:#1B2433;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:420px}
.toast.bad{background:var(--danger)}
.foot{margin-top:28px;font-size:12px;color:var(--muted2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--pri);cursor:pointer;font-size:12px;text-decoration:underline;padding:0}
.toast{pointer-events:auto}
</style>

<script>
// ---------- Master data ----------
const USERS = {
  b1:  { name: 'Mr. Jirach Chaiyotha', role: 'Buyer', empId: '26010063', position: 'Procurement Engineer', division: 'C-PM-PP2' },
  b2:  { name: 'Ms. Waranya Chaiwat', role: 'Buyer', empId: '26010021', position: 'Senior Buyer', division: 'C-PM-PP1' },
  dm1: { name: 'Mr. Somchai Rattanakul', role: 'DM', title: 'DM Procurement' },
  dm2: { name: 'Mr. Nattapong Srisuk', role: 'DM', title: 'DM Procurement' },
  vp1: { name: 'Mr. Wichai Prasertsri', role: 'VP', title: 'VP Procurement' },
  vp2: { name: 'Ms. Apinya Rojanasakul', role: 'VP', title: 'VP Procurement' },
  dmd1:{ name: 'Mr. Prasert Thongdee', role: 'DMD', title: 'DMD' },
  dmd2:{ name: 'Ms. Kanokwan Meesuk', role: 'DMD', title: 'DMD' },
  md1: { name: 'Mr. Kittipong Wongsawat', role: 'MD', title: 'MD' },
  ac1: { name: 'Ms. Siriporn Anantachai', role: 'AC', title: 'Accounting (MD-FA-AC)' },
  ac2: { name: 'Ms. Pimchanok Lertpanya', role: 'AC', title: 'Accounting (MD-FA-AC)' }
};
// Approval authority (sequential). Basis = total amount Inc. VAT 7%.
const LEVELS = [
  { key: 'DM',  label: 'DM Procurement', limit: 100000,   rule: '< 100,000 THB',   def: 'dm1' },
  { key: 'VP',  label: 'VP Procurement', limit: 500000,   rule: '< 500,000 THB',   def: 'vp1' },
  { key: 'DMD', label: 'DMD',            limit: 2000000,  rule: '< 2,000,000 THB', def: 'dmd1' },
  { key: 'MD',  label: 'MD',             limit: Infinity, rule: '≥ 2,000,000 THB', def: 'md1' }
];
const DIVISIONS = ['C-PM-PP1', 'C-PM-PP2', 'C-PM-PP3', 'C-PM-MP'];
const VENDORS = ['DHL Global Forwarding (Thailand) Ltd.', 'Kerry Logistics (Thailand) Co., Ltd.', 'Nippon Express (Thailand) Co., Ltd.', 'Kintetsu World Express (Thailand) Co., Ltd.', 'DB Schenker (Thailand) Ltd.', 'Expeditors (Thailand) Ltd.'];
const GLS = ['5101020 – Freight & Transportation', '5101030 – Import Duty & Customs', '5101040 – Port & Terminal Charges', '5101050 – Demurrage & Detention', '5101060 – Inspection & Survey Fee'];
const TYPES = {
  1: { short: 'Type 1', name: 'Advance Payment', bg: '#E3F0FD', fg: '#0B5CAD', dot: '#1E88E5' },
  2: { short: 'Type 2', name: 'Advance Payment & Advance Clearance', bg: '#EFEAFB', fg: '#5B3BA8', dot: '#8E6BE0' }
};
const S = {
  DRAFT: 'Draft', WAPP: 'Waiting Approval', REJ: 'Rejected', WACK: 'Waiting Accounting',
  WCLR: 'Waiting Clearance', CDRAFT: 'Clearance Draft', CWAPP: 'Clearance Waiting Approval',
  CREJ: 'Clearance Rejected', CWACK: 'Clearance Waiting Accounting', DONE: 'Completed'
};
const AC_PHASE = [S.WCLR, S.CDRAFT, S.CWAPP, S.CREJ, S.CWACK];
const SC = { // status colors: bg, border, fg
  [S.DRAFT]: ['#F1F3F7', '#D0D5DD', '#344054'], [S.CDRAFT]: ['#F1F3F7', '#D0D5DD', '#344054'],
  [S.WAPP]: ['#EEF0FF', '#C5CAF5', '#27298A'], [S.CWAPP]: ['#EEF0FF', '#C5CAF5', '#27298A'],
  [S.WACK]: ['#FFF0DB', '#F5C98A', '#8A4B00'], [S.CWACK]: ['#FFF0DB', '#F5C98A', '#8A4B00'],
  [S.WCLR]: ['#E3F0FD', '#A9CDF3', '#0B5CAD'],
  [S.REJ]: ['#FDECEC', '#F3B5B5', '#B42318'], [S.CREJ]: ['#FDECEC', '#F3B5B5', '#B42318'],
  [S.DONE]: ['#E6F6EA', '#B7E3C1', '#146C2E'],
  Waiting: ['#F1F3F7', '#D0D5DD', '#5B6678'], Pending: ['#EEF0FF', '#C5CAF5', '#27298A'],
  Approved: ['#E6F6EA', '#B7E3C1', '#146C2E'], Acknowledged: ['#E6F6EA', '#B7E3C1', '#146C2E'],
  Rejected: ['#FDECEC', '#F3B5B5', '#B42318'], Returned: ['#FDECEC', '#F3B5B5', '#B42318']
};

// ---------- Helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const money = (n) => r2(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fdate = (iso, time) => { if (!iso) return '-'; const d = new Date(iso); const p = (x) => String(x).padStart(2, '0');
  return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear() + (time === false ? '' : ' ' + p(d.getHours()) + ':' + p(d.getMinutes())); };
let CLOCK = null; // seed data uses a fixed clock
const now = () => CLOCK || new Date().toISOString();
const uname = (id) => (USERS[id] ? USERS[id].name : id || '-');
const badge = (txt) => { const c = SC[txt] || SC.Waiting; return '<span class="badge" style="background:' + c[0] + ';border-color:' + c[1] + ';color:' + c[2] + '">' + esc(txt) + '</span>'; };
const typeBadge = (t) => { const x = TYPES[t]; return '<span class="badge" title="' + esc(x.name) + '" style="background:' + x.bg + ';border-color:' + x.bg + ';color:' + x.fg + '"><span class="dot" style="background:' + x.dot + '"></span>' + x.short + '</span>'; };
const docLabel = (d) => d.no + (d.rev > 0 ? ' R' + d.rev : '');
const calc = (items) => { let ex = 0, vat = 0; items.forEach((it) => { const a = r2(it.amt); ex += a; vat += r2(a * 0.07); }); return { ex: r2(ex), vat: r2(vat), inc: r2(ex + vat) }; };
const emptyItem = () => ({ desc: '', gl: '', cc: '', io: '', amt: '' });

// ---------- Engine ----------
function chain(total, prev) {
  return LEVELS.filter((l, i) => i === 0 || total >= LEVELS[i - 1].limit).map((l) => {
    const p = (prev || []).find((a) => a.level === l.key);
    return { level: l.key, user: p ? p.user : l.def, status: 'Waiting', at: '', comment: '' };
  });
}
const isAC = (d) => AC_PHASE.includes(d.status) || (d.status === S.DONE && d.type === 2);
const flowOf = (d) => (isAC(d) && d.clr ? d.clr : d); // object holding items/approvers/ack for the active phase
function log(d, by, action, comment) { d.history.unshift({ at: now(), by, action, rev: d.rev, comment: comment || '' }); d.updatedAt = now(); }
function validate(d, phaseAC) {
  const errs = [];
  if (!phaseAC) {
    const i = d.info;
    [['requester', 'Requester Name'], ['empId', 'Employee ID'], ['position', 'Position'], ['division', 'Division Indicator'], ['vendor', 'Vendor Name'], ['details', 'Describe the details']]
      .forEach(([k, l]) => { if (!String(i[k] || '').trim()) errs.push({ path: 'info.' + k, msg: l }); });
  }
  const pre = phaseAC ? 'clr.' : '';
  const items = phaseAC ? d.clr.items : d.items;
  if (!items.length) errs.push({ path: '', msg: 'At least one expense row' });
  items.forEach((it, n) => {
    ['desc', 'gl', 'cc'].forEach((k) => { if (!String(it[k] || '').trim()) errs.push({ path: pre + 'items.' + n + '.' + k, msg: 'Row ' + (n + 1) + ' ' + { desc: 'Description', gl: 'GL Account', cc: 'Cost Center' }[k] }); });

const ENGINE = {

    Object.assign(a, { status: 'Approved', at: now(), comment: c || '', by: u });

    if (f.approvers[i + 1]) f.approvers[i + 1].status = 'Pending';

  reject(d, u, c) {

  },
  ack(d, u, c) {

  },
  ackReturn(d, u, c) {

    return '<tr><td style="width:36px;color:var(--muted2)">' + (n + 1) + '</td><td' + mw(180) + '>' + cell(n, 'desc', it.desc, 'Description') + '</td><td' + mw(150) + '>' + cell(n, 'gl', it.gl, 'GL Account', 'gl-list') + '</td><td' + mw(100) + '>' + cell(n, 'cc', it.cc, 'Cost Center') + '</td><td' + mw(130) + '>' + cell(n, 'io', it.io, 'Budget Holder / IO') + '</td>' +
      '<td class="r"' + mw(130) + '>' + (editable ? '<input class="t r' + (ui.errs.some((e) => e.path === pre + n + '.amt') ? ' err' : '') + '" type="number" min="0" step="0.01" data-bind="' + pre + n + '.amt" value="' + esc(it.amt) + '" placeholder="0.00">' : money(a)) + '</td>' +
      '<td class="r" id="' + scope + '-vat-' + n + '">' + money(v) + '</td><td class="r" id="' + scope + '-inc-' + n + '">' + money(a + v) + '</td>' +
      (editable ? '<td style="width:44px"><button class="iconbtn" data-act="delrow" data-scope="' + scope + '" data-n="' + n + '" title="Delete row" aria-label="Delete row ' + (n + 1) + '"' + (items.length < 2 ? ' disabled' : '') + '>×</button></td>' : '') + '</tr>'; }).join('');
  return '<div class="tscroll"><table class="grid items"><thead><tr><th>#</th><th>Description</th><th>GL Account</th><th>Cost Center</th><th>Budget Holder / IO</th><th class="r">Amount (Ex VAT 7%)</th><th class="r">VAT 7%</th><th class="r">Amount (Inc VAT 7%)</th>' + (editable ? '<th></th>' : '') + '</tr></thead><tbody>' + rows + '</tbody>' +
    '<tfoot><tr><td></td><td colspan="4">Total (THB)</td><td class="r" id="' + scope + '-tex">' + money(t.ex) + '</td><td class="r" id="' + scope + '-tvat">' + money(t.vat) + '</td><td class="r" id="' + scope + '-tinc">' + money(t.inc) + '</td>' + (editable ? '<td></td>' : '') + '</tr></tfoot></table></div>' +
    (editable ? '<button class="btn sm addrow" data-act="addrow" data-scope="' + scope + '">+ Add Row</button>' : '');
}
function approverBlock(scope, f, editable) {
  const total = calc(f.items).inc;
  const list = editable ? chain(total, f.approvers) : f.approvers;
  const route = '<div class="route">Approval route (Total Inc. VAT ' + money(total) + ' THB):' + LEVELS.map((l) => '<span class="lv' + (list.some((a) => a.level === l.key) ? ' on' : '') + '" title="' + esc(l.rule) + '">' + l.label + ' <span style="font-weight:400">' + esc(l.rule) + '</span></span>').join('') + '</div>';
  const rows = list.map((a, n) => { const l = LEVELS.find((x) => x.key === a.level);
    const people = Object.keys(USERS).filter((k) => USERS[k].role === a.level);
    const who = editable ? '<select class="t" style="min-width:220px" data-bind="' + (scope === 'clr' ? 'clr.' : '') + 'approvers.' + n + '.user" data-level="' + a.level + '">' + people.map((k) => '<option value="' + k + '"' + (k === a.user ? ' selected' : '') + '>' + esc(USERS[k].name) + '</option>').join('') + '</select>' : esc(uname(a.user));
    return '<tr><td>' + (n + 1) + '</td><td><b>' + l.label + '</b><div style="font-size:12px;color:var(--muted2)">' + esc(l.rule) + '</div></td><td>' + who + '</td><td>' + badge(a.status) + '</td><td style="white-space:nowrap">' + fdate(a.at) + '</td><td>' + esc(a.comment || '-') + '</td></tr>'; }).join('');
  const k = f.ack || {}; const ackSt = k.status || 'Waiting';
  const ackRow = '<tr style="background:#FAFBFD"><td>' + (list.length + 1) + '</td><td><b>Accounting</b><div style="font-size:12px;color:var(--muted2)">MD-FA-AC · Acknowledge</div></td><td>' + (k.by ? esc(uname(k.by)) : 'MD-FA-AC team') + '</td><td>' + badge(ackSt) + '</td><td style="white-space:nowrap">' + fdate(k.at) + '</td><td>' + esc(k.comment || '-') + '</td></tr>';
  return route + '<div class="tscroll"><table class="grid"><thead><tr><th>Seq</th><th>Approval Level</th><th>Approver</th><th>Status</th><th>Date</th><th>Comment</th></tr></thead><tbody>' + rows + ackRow + '</tbody></table></div>';
}
function clrSummary(d, c) {
  const adv = calc(d.items).inc, act = calc(c.items).inc, diff = r2(adv - act);
  const lbl = diff > 0 ? 'Refund to company' : diff < 0 ? 'Additional payment to requester' : 'Balanced';
  const col = diff > 0 ? '#146C2E' : diff < 0 ? '#B42318' : 'var(--ink)';
  return '<div class="diff"><div class="stat"><span>Advance Payment (Inc VAT)</span><b>' + money(adv) + '</b></div><div class="stat"><span>Actual Expense (Inc VAT)</span><b>' + money(act) + '</b></div><div class="stat"><span>Difference · ' + lbl + '</span><b style="color:' + col + '">' + money(Math.abs(diff)) + '</b></div></div>';
}
function renderDoc() {
  const d = cur(), v = src(), u = me();
  const editAP = ui.edit && v.status === S.DRAFT, editAC = ui.edit && v.status === S.CDRAFT;
  const showClr = d.type === 2 && v.clr;
  const btns = actionsFor(d).map(([a, l, c]) => '<button class="btn ' + c + '" data-act="' + a + '">' + l + '</button>').join('');
  const i = v.info;
  let h = '<button class="back" data-act="list">‹ Back to Task List</button>' +
    '<div class="pagehead"><div><h1>' + (ui.isNew ? 'New Advance Payment' : esc(docLabel(d))) + ' ' + typeBadge(d.type) + ' ' + badge(ui.isNew ? 'Draft' : d.status) + '</h1>' +
    '<div class="sub">Advance Payment Application for Freight Forwarder · ' + esc(TYPES[d.type].name) + (ui.isNew ? '' : ' · Created ' + fdate(d.createdAt) + ' by ' + esc(uname(d.createdBy))) + '</div></div><div class="actions">' + btns + '</div></div>' +
    notice(d) + flowSteps(d) + '<div class="layout"><div>';
  h += '<div class="card"><div class="card-h">Advance Payment<small>Part 1 – 3</small></div>' +
    '<div class="sec"><div class="sec-h"><span class="n">1</span>General Information</div><div class="form-grid">' +
    field('info.requester', 'Requester Name', i.requester, editAP) + field('info.empId', 'Employee ID', i.empId, editAP) + field('info.position', 'Position', i.position, editAP) +
    field('info.division', 'Division Indicator', i.division, editAP, { select: DIVISIONS }) + field('info.vendor', 'Vendor Name (Freight Forwarder)', i.vendor, editAP, { list: 'vendor-list', cls: 'span2', ph: 'Select or type vendor name' }) +
    field('info.details', 'Describe the details', i.details, editAP, { area: true, cls: 'span3', ph: 'รายละเอียดวัตถุประสงค์ของการเบิกเงินทดรองจ่าย เช่น B/L, Shipment, PO' }) + '</div></div>' +
    '<div class="sec"><div class="sec-h"><span class="n">2</span>Expense Details<span class="aside">VAT 7% calculated automatically</span></div>' + itemsTable('ap', v.items, editAP) + '</div>' +
    '<div class="sec"><div class="sec-h"><span class="n">3</span>Approver<span class="aside">' + (editAP ? 'Route updates with total amount · approver selectable per level' : 'Sequential approval') + '</span></div><div id="appr-ap">' + approverBlock('ap', v, editAP) + '</div></div></div>';
  if (showClr) {
    h += '<div class="card"><div class="card-h ac">Advance Clearance<small>Part 4 – 5</small></div>' +
      '<div class="sec"><div class="sec-h"><span class="n">4</span>Actual Expense Details</div>' +
      '<div class="form-grid" style="margin-bottom:16px">' + field('clr.remark', 'Clearance remark', v.clr.remark, editAC, { area: true, cls: 'span3', ph: 'สรุปค่าใช้จ่ายจริง / เลขที่ใบเสร็จ / เหตุผลส่วนต่าง' }).replace(' <span class="req">*</span>', '') + '</div>' +
      itemsTable('clr', v.clr.items, editAC) + '<div id="clr-sum">' + clrSummary(v, v.clr) + '</div></div>' +
      '<div class="sec"><div class="sec-h"><span class="n">5</span>Clearance Approver</div><div id="appr-clr">' + approverBlock('clr', v.clr, editAC) + '</div></div></div>';
  }
  h += '</div><div class="side">' + sidePanel(d, v) + '</div></div>';
  h += '<datalist id="vendor-list">' + VENDORS.map((x) => '<option value="' + esc(x) + '">').join('') + '</datalist><datalist id="gl-list">' + GLS.map((x) => '<option value="' + esc(x) + '">').join('') + '</datalist>';
  return h;
}
function sidePanel(d, v) {
  const t = calc(v.items);
  let h = '<div class="card"><div class="card-h">Summary</div><div class="body" id="side-sum">' +
    '<div class="kv"><span>Document No.</span><b>' + (ui.isNew ? '(assigned on save)' : esc(docLabel(d))) + '</b></div>' +
    '<div class="kv"><span>Revision</span><b>R' + d.rev + '</b></div>' +
    '<div class="kv"><span>Advance Ex VAT</span><b>' + money(t.ex) + '</b></div><div class="kv"><span>VAT 7%</span><b>' + money(t.vat) + '</b></div>' +
    '<div class="kv"><span>Advance Inc VAT</span><b style="color:var(--pri)">' + money(t.inc) + ' THB</b></div>' +
    (v.clr ? '<div class="kv"><span>Actual Expense Inc VAT</span><b>' + money(calc(v.clr.items).inc) + ' THB</b></div>' : '') +
    '<div class="kv"><span>Pending With</span><b>' + esc(ui.isNew ? '-' : pendingWith(d)) + '</b></div></div></div>';
  if (d.revs.length) h += '<div class="card"><div class="card-h">Revision History</div><div class="body">' + d.revs.slice().reverse().map((r) =>
    '<div class="kv"><span>R' + r.rev + ' · ' + esc(r.phase) + '<br><small>' + esc(r.status) + ' · superseded ' + fdate(r.at, false) + '</small></span><b>' + money(r.total) + '</b></div>').join('') + '</div></div>';
  h += '<div class="card"><div class="card-h">Activity Log</div>' + (d.history.length ? '<ul class="hist">' + d.history.map((x) =>
    '<li><div class="a">' + esc(x.action) + '</div><div class="m">' + esc(uname(x.by)) + ' · ' + fdate(x.at) + ' · R' + x.rev + '</div>' + (x.comment ? '<div class="c">' + esc(x.comment) + '</div>' : '') + '</li>').join('') + '</ul>' : '<div class="body" style="padding:16px 18px;color:var(--muted);font-size:13px">No activity yet.</div>') + '</div>';
  return h;
}

// ---------- Live calc while editing (no full re-render to keep focus) ----------
function refreshCalc(scope) {
  const v = ui.buf, items = scope === 'clr' ? v.clr.items : v.items;
  items.forEach((it, n) => { const a = r2(it.amt), x = r2(a * 0.07); const e1 = $('#' + scope + '-vat-' + n), e2 = $('#' + scope + '-inc-' + n); if (e1) e1.textContent = money(x); if (e2) e2.textContent = money(a + x); });
  const t = calc(items); $('#' + scope + '-tex').textContent = money(t.ex); $('#' + scope + '-tvat').textContent = money(t.vat); $('#' + scope + '-tinc').textContent = money(t.inc);
  const f = scope === 'clr' ? v.clr : v;
  f.approvers = chain(t.inc, f.approvers); // keep buffer in step with the displayed route
  $('#appr-' + scope).innerHTML = approverBlock(scope, f, true);
  if (scope === 'clr') $('#clr-sum').innerHTML = clrSummary(v, v.clr);
  const side = $('.side'); if (side) side.innerHTML = sidePanel(cur(), v);
}
function setPath(obj, path, val) { const p = path.split('.'); let o = obj; for (let k = 0; k < p.length - 1; k++) o = o[p[k]]; o[p[p.length - 1]] = val; }

// ---------- Modals ----------
function modal(html) { $('#modal').innerHTML = '<div class="overlay" data-act="mclose-bg">' + html + '</div>'; const f = $('#modal [autofocus]'); if (f) f.focus(); }
function closeModal() { $('#modal').innerHTML = ''; }
function createModal(sel) {
  const opt = (t, desc, flow) => '<label class="opt' + (sel === t ? ' on' : '') + '"><input type="radio" name="aptype" value="' + t + '"' + (sel === t ? ' checked' : '') + ' data-act-change="ptype"><span><b>' + TYPES[t].short + ' : ' + TYPES[t].name + '</b><span>' + desc + '</span><span class="mini">' + flow + '</span></span></label>';
  const ap = '<i class="ap">Create</i><i class="ap">Approval</i><i class="ap">Accounting Ack</i>', ac = '<i class="ac">Advance Clearance</i><i class="ac">Approval</i><i class="ac">Accounting Ack</i>';
  modal('<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgt"><div class="dlg-h"><h2 id="dlgt">Create Advance Payment</h2><div class="sub">เลือกประเภทเอกสารตาม Workflow เพื่อเริ่มสร้างใบขอเบิก</div></div><div class="dlg-b">' +
    opt(1, 'เบิกเงินทดรองจ่ายให้ Freight Forwarder — จบที่ Accounting รับทราบ (Completed)', ap + '<i class="ap">Completed</i>') +
    opt(2, 'เบิกเงินทดรองจ่าย และต้องทำ Advance Clearance เคลียร์ค่าใช้จ่ายจริงหลังจาก Accounting รับทราบ', ap + ac + '<i class="ac">Completed</i>') +
    '</div><div class="dlg-f"><button class="btn" data-act="mclose">Cancel</button><button class="btn pri" data-act="docreate"' + (sel ? '' : ' disabled style="background:#E3E8EF;color:#5B6678;border-color:#E3E8EF;cursor:not-allowed"') + ' data-v="' + (sel || '') + '">Create</button></div></div>');
}
function commentModal(act, title, sub, okLabel, okCls, required) {
  modal('<div class="dlg small" role="dialog" aria-modal="true" aria-labelledby="dlgt"><div class="dlg-h"><h2 id="dlgt">' + title + '</h2><div class="sub">' + sub + '</div></div><div class="dlg-b">' +
    '<div class="fld"><label>Comment' + (required ? ' <span class="req">*</span>' : ' (optional)') + '</label><textarea class="t" id="mcomment" autofocus></textarea></div></div>' +
    '<div class="dlg-f"><button class="btn" data-act="mclose">Cancel</button><button class="btn ' + okCls + '" data-act="mconfirm" data-v="' + act + '" data-req="' + (required ? 1 : 0) + '">' + okLabel + '</button></div></div>');
}

// ---------- Commands ----------
function commitBuf() {
  const d = cur(), b = ui.buf;
  if (ui.isNew) {
    store.seq += 1; b.id = 'd' + store.seq + '-' + Date.now().toString(36); b.no = 'AP-2026-' + String(store.seq).padStart(4, '0'); b.createdAt = now();
    b.approvers = chain(calc(b.items).inc, b.approvers);
    log(b, me(), 'Created Advance Payment (' + TYPES[b.type].name + ')');
    store.docs.unshift(b); ui.isNew = false; ui.docId = b.id;
    return b;
  }
  if (b.status === S.DRAFT) { d.info = b.info; d.items = b.items; d.approvers = chain(calc(b.items).inc, b.approvers); }
  else d.clr = Object.assign(b.clr, { approvers: chain(calc(b.clr.items).inc, b.clr.approvers) });
  log(d, me(), b.status === S.DRAFT ? 'Saved draft' : 'Saved Advance Clearance draft');
  return d;
}
const COMMENT_ACTS = {
  approve: ['Approve', 'ยืนยันการอนุมัติเอกสาร', 'Approve', 'ok', false],
  reject: ['Reject', 'เอกสารจะถูกส่งกลับไปยัง Buyer เพื่อแก้ไข (Change Revision)', 'Reject', 'danger', true],
  ack: ['Acknowledge', 'Accounting (MD-FA-AC) รับทราบและดำเนินการจ่าย/บันทึกบัญชี', 'Acknowledge', 'ok', false],
  ackReturn: ['Reject (Return to Buyer)', 'ส่งเอกสารกลับไปยัง Buyer เพื่อแก้ไข', 'Reject', 'danger', true],
  rev: ['Change Revision', 'สร้าง Revision ใหม่ สถานะการอนุมัติเดิมจะถูกล้าง และเอกสารกลับเป็น Draft เพื่อแก้ไข', 'Change Revision', 'pri', true]
};
function doAction(act, comment) {
  const d = cur(); const u = me();
  const map = { approve: 'approve', reject: 'reject', ack: 'ack', ackReturn: 'ackReturn', rev: 'changeRev' };
  ENGINE[map[act]](d, u, comment);
  save(); closeModal();
  if (act === 'rev') { ui.edit = true; ui.buf = clone(d); toast('Changed to revision R' + d.rev + ' – document is editable'); }
  else { ui.edit = false; toast({ approve: 'Approved', reject: 'Rejected – returned to Buyer', ack: 'Acknowledged', ackReturn: 'Returned to Buyer' }[act] + ' · ' + docLabel(d)); }
  render();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'mclose-bg') { if (e.target === el) closeModal(); return; }
  if (a === 'mclose') return closeModal();
  if (a === 'list') return go('list');
  if (a === 'open') return go('doc', el.dataset.id);
  if (a === 'ftype') { ui.f.type = el.dataset.v; ui.page = 1; return render(); }
  if (a === 'page') { ui.page = Number(el.dataset.v); return render(); }
  if (a === 'create') return createModal(null);
  if (a === 'docreate') { if (!el.dataset.v) return; closeModal(); ui.view = 'doc'; ui.isNew = true; ui.edit = true; ui.errs = []; ui.buf = newDoc(Number(el.dataset.v), me()); render(); window.scrollTo(0, 0); return; }
  if (a === 'reset') return modal('<div class="dlg small" role="dialog" aria-modal="true" aria-labelledby="dlgt"><div class="dlg-h"><h2 id="dlgt">Reset demo data</h2><div class="sub">ลบเอกสารทั้งหมดในเบราว์เซอร์นี้ และโหลดข้อมูลตัวอย่างใหม่</div></div><div class="dlg-f"><button class="btn" data-act="mclose">Cancel</button><button class="btn danger" data-act="doreset">Reset</button></div></div>');
  if (a === 'doreset') { closeModal(); store = seed(); save(); go('list'); toast('Demo data reset'); return; }
  if (a === 'addrow' || a === 'delrow') {
    const items = el.dataset.scope === 'clr' ? ui.buf.clr.items : ui.buf.items;
    if (a === 'addrow') items.push(emptyItem()); else if (items.length > 1) items.splice(Number(el.dataset.n), 1);
    ui.errs = []; return render();
  }
  if (a === 'edit') { ui.edit = true; ui.buf = clone(cur()); const f = ui.buf.status === S.CDRAFT ? ui.buf.clr : ui.buf; f.approvers = chain(calc(f.items).inc, f.approvers); ui.errs = []; return render(); }
  if (a === 'cancel') { if (ui.isNew) return go('list'); ui.edit = false; ui.buf = null; ui.errs = []; return render(); }
  if (a === 'save') { commitBuf(); save(); ui.edit = false; ui.buf = null; ui.errs = []; toast('Saved · ' + docLabel(cur())); return render(); }
  if (a === 'submit') {
    const target = ui.edit ? ui.buf : cur(); const errs = validate(target, target.status === S.CDRAFT);
    if (errs.length) {
      if (!ui.edit) { ui.edit = true; ui.buf = clone(cur()); }
      ui.errs = errs; render(); toast('Please complete: ' + errs.slice(0, 4).map((x) => x.msg).join(', ') + (errs.length > 4 ? ' …' : ''), true); return;
    }
    const d = ui.edit ? commitBuf() : cur();
    ENGINE.submit(d, me()); save(); ui.edit = false; ui.buf = null; ui.errs = [];
    toast('Submitted · pending with ' + pendingWith(d)); return render();
  }
  if (a === 'startClr') { const d = cur(); ENGINE.startClr(d, me()); save(); ui.edit = true; ui.buf = clone(d); toast('Advance Clearance created – enter actual expenses'); return render(); }
  if (COMMENT_ACTS[a]) { const c = COMMENT_ACTS[a]; return commentModal(a, c[0] + ' · ' + esc(docLabel(cur())), c[1], c[2], c[3], c[4]); }
  if (a === 'mconfirm') {
    const c = $('#mcomment').value.trim();
    if (el.dataset.req === '1' && !c) { $('#mcomment').classList.add('err'); $('#mcomment').focus(); return; }
    return doAction(el.dataset.v, c);
  }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.actInput === 'fq') { ui.f.q = el.value; ui.page = 1; const pos = el.selectionStart; render(); const n = $('[data-act-input="fq"]'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (el.dataset.bind && ui.buf) {
    setPath(ui.buf, el.dataset.bind, el.value);
    if (el.classList.contains('err')) el.classList.remove('err');
    if (/\.amt$/.test(el.dataset.bind)) refreshCalc(el.dataset.bind.startsWith('clr.') ? 'clr' : 'ap');
  }
});
document.addEventListener('change', (e) => {
  const el = e.target, a = el.dataset.actChange;
  if (a === 'user') { store.user = el.value; save(); ui.edit = false; ui.buf = null; ui.errs = []; if (ui.isNew) go('list'); else render(); toast('Now acting as ' + USERS[el.value].name); return; }
  if (a === 'fstatus') { ui.f.status = el.value; ui.page = 1; return render(); }
  if (a === 'ptype') return createModal(Number(el.value));
  if (el.dataset.bind && ui.buf && el.tagName === 'SELECT') setPath(ui.buf, el.dataset.bind, el.value);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#modal').innerHTML) closeModal(); });
// boot
save(); render();
</script>
